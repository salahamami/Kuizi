# Kuizi CI (T006). Finds every project (scripts/ci/discover.py) and runs the reusable workflow of
# its language, so a new project gets CI without editing this file. Guide: docs/dev/ci.md.
# Branch protection requires one check only: "CI result" (the last job below).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Every job states the permissions it needs; nothing is granted by default.
permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # A newer push replaces a running check on a branch; runs on main always finish (they publish).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  discover:
    name: Discover projects
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      python: ${{ steps.find.outputs.python }}
      typescript: ${{ steps.find.outputs.typescript }}
      containers: ${{ steps.find.outputs.containers }}
      images: ${{ steps.find.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find Python projects, TypeScript packages and Dockerfiles
        id: find
        run: python3 scripts/ci/discover.py --github-output

  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: make check (compose file, agent briefs, backlog, pinned actions)
        run: make check
      - name: Tests of the discovery script
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s scripts/ci -v
      - name: Ruff on Python outside the projects (scripts)
        if: ${{ !cancelled() }}
        run: |
          ruff_version="$(sed -n 's/^required-version = "==\(.*\)"$/\1/p' ruff.toml)"
          # Python projects are linted by their own job; skip them here.
          mapfile -t skip < <(python3 scripts/ci/discover.py --list python | awk '{print "--extend-exclude=" $1}')
          uvx "ruff@${ruff_version}" check --output-format=github "${skip[@]}" .
          uvx "ruff@${ruff_version}" format --check "${skip[@]}" .
      - name: Set up pnpm (version from package.json)
        if: ${{ !cancelled() }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js (version from package.json, cache keyed on pnpm-lock.yaml)
        if: ${{ !cancelled() }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: TypeScript workspace (pnpm-lock.yaml up to date, Prettier)
        if: ${{ !cancelled() }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run format:check
      - name: Lint the workflows (actionlint with shellcheck)
        if: ${{ !cancelled() }}
        run: |
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "${RUNNER_TEMP}/actionlint" -color

  python:
    name: Python
    needs: discover
    if: ${{ needs.discover.outputs.python != '[]' }}
    permissions:
      contents: read
    uses: ./.github/workflows/python.yml
    with:
      projects: ${{ needs.discover.outputs.python }}

  typescript:
    name: TypeScript
    needs: discover
    if: ${{ needs.discover.outputs.typescript != '[]' }}
    permissions:
      contents: read
    uses: ./.github/workflows/typescript.yml
    with:
      packages: ${{ needs.discover.outputs.typescript }}

  containers:
    name: Containers
    needs: discover
    # Branches and pull requests: build, SBOM and scan every image, never push.
    if: >-
      ${{ needs.discover.outputs.containers != '[]'
      && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    permissions:
      contents: read
    uses: ./.github/workflows/container.yml
    with:
      images: ${{ needs.discover.outputs.containers }}
      publish: false

  containers-publish:
    name: Containers (publish)
    needs: [discover, repository, python, typescript]
    # main only, and only when every other check passed: build, SBOM, scan, then push, sign with
    # cosign (keyless) and attach the SBOM as a signed attestation. GHCR today, ECR after T240.
    if: >-
      ${{ !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.discover.outputs.images != '[]'
      && needs.repository.result == 'success'
      && !contains(needs.*.result, 'failure') }}
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing with the workflow's OIDC identity
    uses: ./.github/workflows/container.yml
    with:
      images: ${{ needs.discover.outputs.images }}
      publish: true

  result:
    name: CI result
    if: ${{ always() }}
    needs: [discover, repository, python, typescript, containers, containers-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed, or was skipped because it had nothing to check
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::A CI job failed or was cancelled: this change cannot be merged yet."
            exit 1
          fi
