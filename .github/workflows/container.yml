# Reusable container workflow (T006), called by ci.yml with the Dockerfiles found by
# scripts/ci/discover.py.
#   Every run: build with Buildx, Syft SBOM (SPDX JSON), Trivy scan that fails on any CRITICAL
#   vulnerability or secret. Reports are kept as workflow artifacts.
#   publish: true (main only): push the scanned image, sign it with cosign (keyless, the
#   workflow's GitHub OIDC identity) and attach the SBOM as a signed attestation.
# Registry: GHCR today; ECR after the cloud move (T240) by changing `registry` and the login step.
name: Container images

on:
  workflow_call:
    inputs:
      images:
        description: 'JSON list, for example [{"name": "kuizi-routing", "dockerfile": "services/routing/Dockerfile", "context": ".", "publish": true}]'
        required: true
        type: string
      publish:
        description: Push, sign and attest the images (main only; the caller must grant packages and id-token write)
        required: false
        type: boolean
        default: false
      registry:
        description: Registry host
        required: false
        type: string
        default: ghcr.io

# No permissions block on purpose: the job inherits the calling job's token. The scan-only caller
# grants contents: read; the main-branch caller adds packages: write and id-token: write.

jobs:
  image:
    name: ${{ matrix.image.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    env:
      # Values reach the scripts through the environment, never pasted into them.
      IMAGE_NAME: ${{ matrix.image.name }}
      REGISTRY: ${{ inputs.registry }}
      PUBLISH: ${{ inputs.publish && matrix.image.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image reference
        id: ref
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          {
            echo "image=${image}"
            echo "tag=${image}:sha-${GITHUB_SHA::12}"
            echo "date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (loaded locally, nothing pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false # the job summary is enough; no extra artifact
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          load: true
          push: false
          provenance: false
          tags: ${{ steps.ref.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: SBOM (Syft, SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.ref.outputs.tag }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: ${{ matrix.image.name }}.spdx.json
          syft-version: v1.54.0
          upload-release-assets: false

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
          cache: true

      - name: Restore the Trivy vulnerability database (refreshed daily)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.ref.outputs.date }}
          restore-keys: trivy-db-

      - name: Vulnerability report (every severity kept, HIGH and CRITICAL shown)
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          trivy image --format json --output trivy-report.json "$TAG"
          trivy convert --format table --severity HIGH,CRITICAL trivy-report.json

      - name: Gate - fail on any CRITICAL vulnerability or secret
        id: gate
        run: |
          # Reads the report above (no second scan). Fixed or not: an unfixable CRITICAL needs
          # another base image or a reviewed entry in .trivyignore (product owner approval,
          # docs/dev/ci.md).
          trivy convert --format table --severity CRITICAL --exit-code 1 trivy-report.json

      - name: Keep the vulnerability report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.image.name }}-trivy-report
          path: trivy-report.json
          if-no-files-found: ignore
          retention-days: 30

      # ---- main only: push the image that was scanned, sign it, attach the SBOM ----

      - name: Log in to the registry
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push
        id: push
        if: ${{ env.PUBLISH == 'true' }}
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          docker push "$TAG"
          docker tag "$TAG" "${IMAGE}:main"
          docker push "${IMAGE}:main"
          digest="$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" == sha256:* ]] || { echo "::error::Could not read the pushed digest"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Set up cosign
        if: ${{ env.PUBLISH == 'true' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image and attach the SBOM (cosign keyless)
        if: ${{ env.PUBLISH == 'true' }}
        env:
          REF: ${{ steps.ref.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"

      - name: Verify the signature and the SBOM attestation
        if: ${{ env.PUBLISH == 'true' }}
        env:
          REF: ${{ steps.ref.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/container.yml@${GITHUB_REF}"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$REF" > /dev/null
          cosign verify-attestation --type spdxjson \
            --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$REF" > /dev/null
          echo "Signature and SBOM attestation verified for $REF"

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          TAG: ${{ steps.ref.outputs.tag }}
          GATE: ${{ steps.gate.outcome }}
          DIGEST: ${{ steps.push.outputs.digest }}
          DOCKERFILE: ${{ matrix.image.dockerfile }}
        run: |
          packages="$(jq '.packages | length' sbom.spdx.json 2>/dev/null || echo "?")"
          counts="$(jq -r '[.Results[]?.Vulnerabilities[]?.Severity] | group_by(.) | map("\(.[0]): \(length)") | join(", ")' trivy-report.json 2>/dev/null || true)"
          {
            echo "### Image: ${IMAGE_NAME}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Dockerfile | \`${DOCKERFILE}\` |"
            echo "| SBOM | ${packages} packages (artifact \`${IMAGE_NAME}.spdx.json\`) |"
            echo "| Vulnerabilities | ${counts:-none} |"
            echo "| CRITICAL gate | ${GATE:-not run} |"
            if [ "$PUBLISH" = "true" ]; then
              echo "| Published | \`${TAG%:*}@${DIGEST:-not pushed}\`, signed, SBOM attested |"
            else
              echo "| Published | no (branch, pull request or CI fixture) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
