# Reusable TypeScript checks (T006, ADR 0008), called by ci.yml with the pnpm workspace packages
# found by scripts/ci/discover.py. Every package has the scripts lint, typecheck, test and build;
# test runs Vitest, and CI adds coverage with the package's gate. Same commands as `make lint/test`.
name: TypeScript

on:
  workflow_call:
    inputs:
      packages:
        description: 'JSON list, for example [{"path": "packages/auth", "id": "packages-auth", "name": "@kuizi/auth", "coverage": 80, "contract": false}]'
        required: true
        type: string

permissions: {}

jobs:
  workspace:
    name: workspace (lockfile, Prettier)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js (version from package.json, cache keyed on pnpm-lock.yaml)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install (fails if pnpm-lock.yaml is out of date)
        run: pnpm install --frozen-lockfile
      - name: Format (prettier --check)
        run: pnpm run format:check

  package:
    name: ${{ matrix.package.path }}
    # No package yet: the job is skipped and CI still passes.
    if: ${{ inputs.packages != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages) }}
    env:
      # Values reach the scripts through the environment, never pasted into them.
      PACKAGE: ${{ matrix.package.name }}
      PACKAGE_PATH: ${{ matrix.package.path }}
      COVERAGE_MIN: ${{ matrix.package.coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js (version from package.json, cache keyed on pnpm-lock.yaml)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile
      - name: Build the workspace packages it depends on
        id: deps
        run: pnpm --filter "${PACKAGE}^..." run --if-present build

      - name: Lint
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm --filter "$PACKAGE" run lint
      - name: Type check
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm --filter "$PACKAGE" run typecheck
      - name: Unit tests with coverage (gate ${{ matrix.package.coverage }} % of lines)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          status=0
          pnpm --filter "$PACKAGE" run test --coverage.enabled --coverage.provider=v8 \
            --coverage.reporter=text --coverage.reporter=json-summary --coverage.reporter=cobertura \
            --coverage.reportsDirectory=coverage --coverage.thresholds.lines="${COVERAGE_MIN}" || status=$?
          summary="${PACKAGE_PATH}/coverage/coverage-summary.json"
          if [ -f "$summary" ]; then
            jq -r --arg p "$PACKAGE_PATH" --arg g "$COVERAGE_MIN" \
              '"### Coverage: \($p) (gate \($g) % of lines)\n\n| Lines | Statements | Branches | Functions |\n| --- | --- | --- | --- |\n| \(.total.lines.pct) % | \(.total.statements.pct) % | \(.total.branches.pct) % | \(.total.functions.pct) % |"' \
              "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Contract tests (Pact, the package's test:contract script)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && matrix.package.contract }}
        run: pnpm --filter "$PACKAGE" run test:contract
      - name: Build
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm --filter "$PACKAGE" run build

      - name: Keep the coverage report and pact files
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-${{ matrix.package.id }}-reports
          path: |
            ${{ matrix.package.path }}/coverage/
            ${{ matrix.package.path }}/pacts/
          if-no-files-found: ignore
          retention-days: 14
