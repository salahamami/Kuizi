[project]
name = "kuizi-kc-graph"
version = "0.1.0"
description = "Kuizi knowledge-component graph (T032): PostgreSQL store with cycle checks, starter Physics seed, loader and the JSON export read by routing and the tutor RAG."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",  # LGPL-3.0, used unmodified as a library: PostgreSQL driver
    "pyyaml>=6.0",           # MIT: read the seed files
    "jsonschema>=4.23",      # MIT: validate exports against export.schema.json
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[project.scripts]
kuizi-kc-graph = "kuizi_kc_graph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kuizi_kc_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "postgres: needs the local PostgreSQL (make up); skipped when it is not reachable unless KUIZI_REQUIRE_POSTGRES=1",
]
