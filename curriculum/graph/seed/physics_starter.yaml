kcs:
  # ---------------------------------------------------------------------------------------
  # Prerequisites taught in mathematics (scope prerequisite in every physics track).
  # T111 builds the Maths graph and may refine these KCs.
  # ---------------------------------------------------------------------------------------
  - id: maths.geometry.vectors          # brain: vect
    name:
      fr: "Vecteurs et repères"
      ar: "الأشعة والمعالم"
    prerequisite_in: [math-4, sexp-4, tech-4]
    source_ref: "Mathematics, earlier secondary years; used by kinematics and Fresnel constructions. To align with the Maths graph (T111)."

  - id: maths.analysis.derivative       # brain: deriv
    name:
      fr: "Dérivées"
      ar: "الاشتقاق"
    prerequisite_in: [math-4, sexp-4, tech-4]
    source_ref: "Mathematics programme (dérivation). To align with the Maths graph (T111)."

  - id: maths.analysis.exponential
    name:
      fr: "Fonction exponentielle"
      ar: "الدالة الأسية"
    requires: [maths.analysis.derivative]
    prerequisite_in: [math-4, sexp-4, tech-4]
    source_ref: "Mathematics programme (fonction exponentielle). To align with the Maths graph (T111)."

  - id: maths.analysis.logarithm
    name:
      fr: "Fonctions logarithmes (népérien et décimal)"
      ar: "الدوال اللوغاريتمية (النيبيري والعشري)"
    requires: [maths.analysis.derivative]
    prerequisite_in: [math-4, sexp-4, tech-4]
    source_ref: "Mathematics programme (fonctions logarithmes); used by radioactive decay and gains in decibels. To align with the Maths graph (T111)."

  - id: maths.analysis.ode1             # brain: eqdiff
    name:
      fr: "Équations différentielles du premier ordre y' = ay + b"
      ar: "المعادلات التفاضلية من الرتبة الأولى y' = ay + b"
    requires: [maths.analysis.derivative, maths.analysis.exponential]
    prerequisite_in: [math-4, sexp-4, tech-4]
    source_ref: "Mathematics programme (équations différentielles). To align with the Maths graph (T111)."

  - id: maths.analysis.ode2
    name:
      fr: "Équation différentielle y'' + ω²y = 0"
      ar: "المعادلة التفاضلية y'' + ω²y = 0"
    requires: [maths.analysis.derivative]
    prerequisite_in: [math-4, sexp-4, tech-4]
    source_ref: "Mathematics programme (équations différentielles); its general solution is a prerequisite of chapter 5 in the CNP 4e physics textbooks. To align with the Maths graph (T111)."

  # ---------------------------------------------------------------------------------------
  # Physics prerequisites from earlier years (named in the chapters' prerequisite pages).
  # ---------------------------------------------------------------------------------------
  - id: physics.found.periodic
    name:
      fr: "Phénomène périodique : période et fréquence"
      ar: "الظاهرة الدورية: الدور والتواتر"
    prerequisite_in: [math-4, sexp-4, tech-4]
    source_ref: "Prerequisite of chapters 3 and 7 in the CNP 4e textbooks; taught in an earlier year (year and chapter to confirm in T035)."

  - id: physics.found.sinusoidal
    name:
      fr: "Grandeur sinusoïdale : amplitude, pulsation et phase initiale"
      ar: "المقدار الجيبي: الوسع والنبض والطور الابتدائي"
    requires: [physics.found.periodic]
    prerequisite_in: [math-4, sexp-4, tech-4]
    source_ref: "Prerequisite of chapters 4 and 7 in the CNP 4e textbooks; taught in an earlier year (to confirm in T035)."

  - id: physics.elec.circuit_laws
    name:
      fr: "Lois des circuits : loi des mailles, loi des nœuds, loi d'Ohm"
      ar: "قوانين الدارات الكهربائية: قانون الحلقات وقانون العقد وقانون أوم"
    prerequisite_in: [math-4, sexp-4, tech-4]
    source_ref: "Prerequisite of chapter 1 in the CNP 4e textbooks; taught in an earlier year (to confirm in T035)."

  - id: physics.elec.magnetic_field
    name:
      fr: "Champ magnétique ; champ créé par un solénoïde"
      ar: "الحقل المغناطيسي؛ الحقل المحدث بوشيعة طويلة"
    requires: [maths.geometry.vectors]
    prerequisite_in: [math-4, sexp-4, tech-4]
    source_ref: "Prerequisite of chapter 2 in the CNP 4e textbooks; taught in an earlier year (to confirm in T035)."

  - id: physics.mech.kinematics         # brain: cinem
    name:
      fr: "Cinématique du point"
      ar: "حركية النقطة المادية"
    requires: [maths.geometry.vectors, maths.analysis.derivative]
    prerequisite_in: [math-4, sexp-4, tech-4]
    source_ref: "Physics, earlier secondary year (cinématique); needed by the dynamics of chapter 5 and by wave celerity. To confirm in T035."

  - id: physics.mech.newton2            # brain: newton
    name:
      fr: "Relation fondamentale de la dynamique (deuxième loi de Newton)"
      ar: "العلاقة الأساسية للتحريك (القانون الثاني لنيوتن)"
