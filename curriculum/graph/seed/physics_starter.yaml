# Starter Physics KC graph for the Tunisian Bac, 4e année (T032, Jira KK-52).
#
# STATUS: STARTER, TO REVIEW. It covers every chapter of the 4e année physics programme of
# the Mathématiques, Sciences expérimentales and Sciences techniques sections, with a few
# KCs per chapter. T035 completes it (about 400 KCs) and a Tunisian physics teacher checks
# it (ADR 0005). Every KC and edge loads with status to_review; nothing here may reach
# students before that review.
#
# PLACEHOLDERS, on purpose:
#   - exam_weight: none is set. No source gave per-concept weights; T035 measures them on
#     ten years of Bac papers. The export shows null.
#   - difficulty_prior: none is set; it comes from item calibration (T043, T044).
#   - Arabic names: Kuizi's own wording, to be checked by the teacher with the French ones.
#
# SOURCES (details and rights in docs/curriculum/kc-graph.md):
#   - CNP textbooks "Physique, 4ème année de l'enseignement secondaire" for the
#     Mathématiques, Sciences expérimentales and Sciences techniques sections
#     (dir. A. Baatout, Centre National Pédagogique). Their forewords say they follow the
#     official programme published in September 2009. We read the tables of contents and
#     the objectives and prerequisites page of each chapter; we record chapter titles and
#     page numbers only. KC names are our own wording; no textbook text is reproduced.
#   - The 12 concepts of the brain walkthrough (ml/kuizi_brain/graph.py), marked
#     "brain: <id>" below.
#
# FORMAT (kuizi.kc-graph.seed, version 1), read by `kuizi-kc-graph validate | load`:
#   subjects, tracks, programmes (with their chapters), then kcs. On each KC:
#     id               stable id = subject.domain.concept..., lowercase; never reused
#     name             fr and ar, both mandatory
#     path             ltree path, defaults to the id
#     requires         prerequisites: KCs that must be known before this one
#     parents          KCs this one is a sub-concept of
#     related          symmetric links (analogies)
#     chapters         core membership: track -> chapter number in that track's programme
#                      (or {chapter, exam_weight, exam_weight_source})
#     prerequisite_in  tracks where the KC is needed but taught elsewhere (earlier year or
#                      another subject); source_ref then says where
#     source_ref       where the KC is taught, or a finer reference
#   A track must hold every prerequisite of its KCs; `validate` checks it.

format: kuizi.kc-graph.seed
format_version: 1

