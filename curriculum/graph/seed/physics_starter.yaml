  - id: physics.mech.hooke
    name:
      fr: "Loi de Hooke : tension d'un ressort"
      ar: "قانون هوك: توتّر نابض"
    prerequisite_in: [math-4, sexp-4, tech-4]
    source_ref: "Prerequisite of chapter 5 in the CNP 4e textbooks; taught in an earlier year (to confirm in T035)."

  - id: physics.optics.descartes
    name:
      fr: "Réflexion et réfraction de la lumière : lois de Descartes"
      ar: "انعكاس الضوء وانكساره: قانونا ديكارت"
    prerequisite_in: [math-4]
    source_ref: "Prerequisite of chapter 8 in the CNP 4e Mathématiques textbook; taught in an earlier year (to confirm in T035)."

  - id: physics.atom.structure
    name:
      fr: "Structure de l'atome et du noyau : nucléons, isotopes, nombre de masse et nombre de charge"
      ar: "بنية الذرة والنواة: النويّات والنظائر والعدد الكتلي وعدد الشحنة"
    prerequisite_in: [math-4, sexp-4]
    source_ref: "Prerequisite of chapters 10 and 11 in the CNP 4e textbooks; taught in an earlier year (to confirm in T035)."

  - id: physics.elec.opamp
    name:
      fr: "Amplificateur opérationnel idéal"
      ar: "المضخّم العملياتي المثالي"
    requires: [physics.elec.circuit_laws]
    prerequisite_in: [tech-4]
    source_ref: "Prerequisite of chapter 8 in the CNP 4e Sciences techniques textbook; taught in an earlier year (to confirm in T035)."

  # ---------------------------------------------------------------------------------------
  # Chapter 1: Le condensateur ; le dipôle RC (all three tracks)
  # ---------------------------------------------------------------------------------------
  - id: physics.elec.rc                 # brain: rc
    name:
      fr: "Le condensateur ; le dipôle RC"
      ar: "المكثّف؛ ثنائي القطب RC"
    chapters: {math-4: 1, sexp-4: 1, tech-4: 1}

  - id: physics.elec.rc.capacitor
    name:
      fr: "Condensateur : charge q, capacité C et relation q = C·u"
      ar: "المكثّف: الشحنة q والسعة C والعلاقة q = C·u"
    parents: [physics.elec.rc]
    requires: [physics.elec.circuit_laws]
