    prerequisite_in: [math-4, sexp-4, tech-4]
    source_ref: "Prerequisite of chapter 5 in the CNP 4e textbooks; taught in an earlier year (to confirm in T035)."

  - id: physics.mech.energy             # brain: energie
    name:
      fr: "Travail et énergie : énergie cinétique, énergie potentielle élastique"
      ar: "العمل والطاقة: الطاقة الحركية والطاقة الكامنة المرنة"
    requires: [physics.mech.newton2]
    prerequisite_in: [math-4, sexp-4, tech-4]
