[project]
name = "kuizi-ml"
version = "0.1.0"
description = "Kuizi brain: knowledge tracing (SAINT+, IRT) notebooks and models. Local environment from T237."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "jupyterlab>=4.2",
    "mlflow-skinny>=2.20",
    "pykt-toolkit>=0.0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kuizi_brain"]

[tool.uv]
# uv's own Python build: identical on every PC, and it includes Tk, which pyKT imports
# (pykt/models/qdkt.py and iekt_ce.py import turtle; a system Python without Tk fails).
python-preference = "only-managed"

# CPU-only PyTorch on Windows (WSL2) and Linux keeps the download small; macOS uses the default build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

# Tests (T006): synthetic data, CPU only, no download. CI and `make test` run
#   uv run --locked pytest --cov
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["kuizi_brain"]
branch = true

[tool.coverage.report]
# Coverage gate for this research library, read by CI (scripts/ci/discover.py). Services keep the
# 80 % gate and apps 70 % (T006). The brain library grows by experiments run from notebooks, so its
# gate stops it growing without tests rather than taxing each experiment (measured: 98 % on
# 2026-10-18; reasons in docs/dev/ci.md).
fail_under = 75
show_missing = true
